[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sebastian-local"
version = "0.2.0"
description = "A private, tag-triggered local Apple Messages assistant"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.33.0,<3",
  "pytypedstream==0.1.0",
]

[project.scripts]
sebastian = "sebastian.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
